<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تغير مواضع الحروف مع التشكيل والنطق</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 15px;
            direction: rtl;
        }
        .container {
            max-width: 950px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h2 {
            text-align: center;
            color: #1a365d;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #4a5568;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .letter-card {
            background: #fff;
            border: 2px solid #cbd5e0;
            border-radius: 10px;
            margin-bottom: 25px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }
        .letter-header {
            background-color: #2b6cb0;
            color: white;
            padding: 12px 20px;
            font-size: 22px;
            font-weight: bold;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border-bottom: 1px solid #edf2f7;
            padding: 12px;
            text-align: center;
            vertical-align: middle;
        }
        th {
            background-color: #edf2f7;
            color: #2d3748;
            font-size: 15px;
        }
        .position-cell {
            font-size: 24px;
            font-weight: bold;
            color: #c53030;
            width: 20%;
        }
        .words-cell {
            text-align: right;
            padding-right: 15px;
            width: 55%;
        }
        .word-tag {
            display: inline-block;
            background-color: #ebf8ff;
            color: #2b6cb0;
            border: 1px solid #bee3f8;
            padding: 6px 12px;
            margin: 4px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: bold;
        }
        .action-cell {
            width: 25%;
        }
        button.speak-btn {
            background-color: #38a169;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: background 0.2s;
        }
        button.speak-btn:hover {
            background-color: #2f855a;
        }
    </style>

    <div class="subtitle" id="totalInfo">جاري تحميل البيانات...</div>

    const contentArea = document.getElementById("contentArea");

    let totalPositions = 0;
    let totalWordsCount = 0;

    data.forEach((item) => {
        let cardHTML = `
            <div class="letter-card">
                <div class="letter-header">
                    <span>${item.letter}</span>
                </div>
                <table>
                    <thead>
                        <tr>

                            <th>3 كلمات أمثلة مشكولة</th>
                            <th>النطق الصوتي</th>
                        </tr>
                    </thead>
                    <tbody>
        `;

        item.positions.forEach(pos => {
            totalPositions++;
            totalWordsCount += pos.words.length;
            const wordsJoined = pos.words.map(w => `<span class="word-tag">${w}</span>`).join(" ");

            cardHTML += `
                <tr>
                    <td class="position-cell">${pos.form}</td>
                    <td class="words-cell">${wordsJoined}</td>
                    <td class="action-cell">
                        <button class="speak-btn" onclick="speakWords(['${pos.words.join("','")}'])">

                        </button>
                    </td>
                </tr>
            `;
        });

        cardHTML += `
                    </tbody>
                </table>
            </div>
        `;
        contentArea.innerHTML += cardHTML;
    });

    totalInfo.innerHTML = `يحتوي التطبيق على <b>28 حرفاً</b> | <b>${totalPositions} موضعاً وشكلاً للحروف</b> | <b>${totalWordsCount} كلمة مشكولة</b> توضح تغيير مكان الحرف.`;

    // وظيفة النطق الصوتي المباشر للكلمات
    function speakWords(wordsArray) {
        if (!('speechSynthesis' in window)) {
            alert("عذراً، ميزة النطق غير مدعومة في جهازك.");
            return;
        }

        window.speechSynthesis.cancel(); // إيقاف أي صوت سابق

        wordsArray.forEach(word => {
            let utterWord = new SpeechSynthesisUtterance(word);
            utterWord.lang = 'ar-SA';
            utterWord.rate = 0.85;
            window.speechSynthesis.speak(utterWord);
        });
    }
